<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приём трансляции</title>
<style>
  body { margin:0; background:#111; color:#fff; font-family:sans-serif; text-align:center; }
  #status { padding:10px; font-size:14px; }
  .wrap { max-width:540px; margin:0 auto; position:relative; background:#000; }
  #outputVideo { width:100%; display:block; }
  #fullscreenBtn {
    position:absolute; bottom:10px; right:10px;
    background:rgba(0,0,0,0.6); color:#fff; border:none;
    padding:8px 14px; border-radius:6px; cursor:pointer; font-size:14px;
  }
</style>
</head>
<body>

<div id="status">Подключение...</div>

<div class="wrap" id="videoWrap">
  <video id="outputVideo" autoplay playsinline muted></video>
  <button id="fullscreenBtn">⛶ На весь экран</button>
</div>

<!-- Скрытые источники: используются только как "материал" для canvas -->
<video id="remoteVideo" autoplay playsinline muted style="display:none"></video>
<img id="bgImage" src="background.png" style="display:none">

<!-- Рабочий canvas для хромакея (отдельный, невидимый) -->
<canvas id="camCanvas" width="540" height="960" style="display:none"></canvas>
<!-- Итоговый canvas: фон + очищенное видео -->
<canvas id="outCanvas" width="540" height="960" style="display:none"></canvas>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// Должно совпадать с ROOM_ID в broadcast.html
const ROOM_ID = "greenscreen-translyaciya-0001";

const statusEl = document.getElementById('status');
const remoteVideo = document.getElementById('remoteVideo');
const bgImage = document.getElementById('bgImage');

const camCanvas = document.getElementById('camCanvas');
const camCtx = camCanvas.getContext('2d', { willReadFrequently: true });

const outCanvas = document.getElementById('outCanvas');
const outCtx = outCanvas.getContext('2d');

const outputVideo = document.getElementById('outputVideo');

// 1. Подключаемся к сигналинг-сервису под своим (любым) ID
const peer = new Peer();

peer.on('open', () => {
  statusEl.textContent = "Звоним трансляции...";
  const emptyStream = new MediaStream(); // нам не нужно отправлять своё видео
  const call = peer.call(ROOM_ID, emptyStream);

  call.on('stream', stream => {
    statusEl.textContent = "Трансляция подключена";
    remoteVideo.srcObject = stream;
    remoteVideo.play();
    startCompositing();
  });

  call.on('close', () => { statusEl.textContent = "Трансляция завершена"; });
  call.on('error', err => { statusEl.textContent = "Ошибка звонка"; console.error(err); });
});

peer.on('error', err => {
  statusEl.textContent = "Ошибка соединения: " + err.type;
  console.error(err);
});

// 2. Запуск цикла отрисовки
let started = false;
function startCompositing() {
  if (started) return;
  started = true;

  const outStream = outCanvas.captureStream(30); // 30 кадров/сек
  outputVideo.srcObject = outStream;

  drawFrame();
}

function drawFrame() {
  const w = camCanvas.width, h = camCanvas.height;

  // --- Шаг 1: рисуем кадр с камеры на рабочий canvas ---
  camCtx.drawImage(remoteVideo, 0, 0, w, h);
  const frame = camCtx.getImageData(0, 0, w, h);
  const data = frame.data;

  // --- Шаг 2: хромакей — зелёные пиксели делаем прозрачными ---
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    if (g > 90 && g > r * 1.3 && g > b * 1.3) {
      data[i + 3] = 0; // альфа = 0 → прозрачный
    }
  }
  camCtx.putImageData(frame, 0, 0);

  // --- Шаг 3: на итоговом canvas сначала фон ---
  if (bgImage.complete) {
    outCtx.drawImage(bgImage, 0, 0, w, h);
  } else {
    outCtx.fillStyle = "#222";
    outCtx.fillRect(0, 0, w, h);
  }

  // --- Шаг 4: поверх фона — очищенное видео (прозрачность уважается) ---
  outCtx.drawImage(camCanvas, 0, 0, w, h);

  requestAnimationFrame(drawFrame);
}

// Кнопка "на весь экран"
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  const wrap = document.getElementById('videoWrap');
  if (!document.fullscreenElement) {
    wrap.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});
</script>

</body>
</html>
